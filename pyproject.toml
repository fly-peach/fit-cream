[project]
name = "fitcream"
version = "0.1.0"
description = "FitCream - FastAPI 健身业务 + LangGraph Agent 融合后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM / Agent
    "langchain>=1.0,<2.0",
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    # LlamaIndex (记忆系统)
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-dashscope>=0.2.0",
    "llama-index-vector-stores-postgres>=0.3.0",
    "llama-index-postprocessor-dashscope-rerank>=0.2.0",
    "pgvector>=0.3.0",
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation / Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # HTTP client
    "httpx>=0.28.0",
    # 阿里云 SMS（号码认证 - 短信认证）
    "alibabacloud_dypnsapi20170525>=2.0.0",
    "alibabacloud_tea_openapi>=0.3.0",
    # 阿里云 OSS
    "oss2>=2.18.0",
    # MCP
    "fastapi-mcp>=0.4.0",
    # 文档解析（unstructured 多格式：Markdown/Excel/CSV/HTML/纯文本）
    "unstructured[md,xlsx,csv]>=0.24.0",
    "PyYAML>=6.0",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["rogers/tests"]
