services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitcream
      POSTGRES_PASSWORD: fitcream
      POSTGRES_DB: fitcream
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/docker/pgsql/fitcreamdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcream"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fitcream:fitcream@db:5432/fitcream
      DEBUG: "false"
      LOG_DIR: /data/logs
    volumes:
      - appdata:/data
      # 动作库媒体(图片+GIF): 绑定挂载, 不进镜像, 更新无需重建容器
      - /opt/fitcream/rogers/static/exercises:/app/rogers/static/exercises:ro
      # 身材原型图(goals): 同 exercises 模式, scp 同步即可, 无需重建镜像
      - /opt/fitcream/rogers/static/goals:/app/rogers/static/goals:ro
      # Android APK: 单文件绑定挂载, 上传新包即生效（勿删源文件, 替换用 cp）
      - /opt/fitcream/rogers/static/fitcream.apk:/app/rogers/static/fitcream.apk:ro
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 数据库定时备份: 每天 03:30 备份到 ./backups (宿主机)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: fitcream
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c "
        echo 'backup service started';
        while true; do
          NOW=$$(date +%Y%m%d-%H%M%S);
          pg_dump -h db -U fitcream -d fitcream -F c -f /backups/fitcream-$$NOW.dump &&
          echo '[backup] ok: fitcream-'$$NOW'.dump' &&
          find /backups -name 'fitcream-*.dump' -mtime +7 -delete;
          sleep 86400;
        done
      "
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  appdata:
